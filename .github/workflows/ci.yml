name: CI

# 离线自检：不需要游戏本体，也不需要 ModTheSpire / BaseMod —— 
# 只编译纯模拟层（engine / search）与离线自检工具，跑数据表、怪物行动与搜索断言，
# 再重放 fixtures 里的差分记录。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  solvertest:
    name: 离线自检（数据表 / 怪物 / 搜索 / 差分重放）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: 编译纯模拟层与自检工具
        run: |
          mkdir -p build/solvertest
          javac -encoding UTF-8 -d build/solvertest \
            src/main/java/com/combatsolver1/engine/*.java \
            src/main/java/com/combatsolver1/search/*.java \
            src/main/java/com/combatsolver1/settings/SolverSettings.java \
            src/main/java/com/combatsolver1/runtime/EngineRootStateBinding.java \
            src/main/java/com/combatsolver1/runtime/PerCardVerify.java \
            tools/solvertest/*.java

      - name: 运行全部离线自检
        run: java -cp build/solvertest Solvertest all

      - name: W3 逐张重采核对注入式停机自检（12 断言）
        run: java -cp build/solvertest PerCardVerifyCheck

      - name: W5 逐机制真值夹具自检（10 夹具 + 边界声明）
        run: java -cp build/solvertest MechanismFixtureCheck

      - name: W5-b 29 个历史真机局面夹具回归（10 断言）
        run: java -cp build/solvertest Historical29Check

      - name: W4 引擎路径药水协议自检（11 断言）
        run: powershell -ExecutionPolicy Bypass -File tools/recordercheck/run-potion-mode-check.ps1

      - name: W7 出牌排序先验「只引导不剪枝」自检（8 断言）
        run: java -cp build/solvertest CardOrderPriorCheck

      - name: W8-d 药水评分调参开关自检（9 断言）
        run: java -cp build/solvertest W8PotionPriorCheck

      - name: W0 参照求解器自检（42 题 × 5 断言）
        run: java -cp build/solvertest SearchQuality --selftest

      - name: W0 离线批量对局冒烟（10 局，同模拟器自打口径）
        run: java -cp build/solvertest BatchPlay --runs 10

      - name: W1 真 RNG 数学层自检（8 断言 + 18 行 TSV）
        run: java -cp build/solvertest RngStreamCheck

      - name: W1 SimState 六流容器自检（12 断言，含旧 xorshift 逐位回归）
        run: java -cp build/solvertest RngStreamStateCheck

      - name: W1 六流注入确定性自检（真机捕获三元组，5 断言）
        run: java -cp build/solvertest RngInjectionCheck

      - name: W1 重放分支真实 RNG / 近似口径自检（8 断言）
        run: java -cp build/solvertest ReplayTruthCheck

      - name: W1 洗牌 LCG 与 java::Random 对齐自检（7 断言）
        run: java -cp build/solvertest JavaLcgCheck

      - name: W1 洗牌/插入位置调用点接入自检（9 断言）
        run: java -cp build/solvertest ShuffleWireCheck

      - name: W1 六流只读反射自检（需要游戏 jar；CI 无版权依赖，明确记为未执行）
        run: |
          if [ -n "$STS_DIR" ] && [ -f "$STS_DIR/desktop-1.0.jar" ]; then
            powershell -ExecutionPolicy Bypass -File tools/rng-capture-validation/run-rngstreams-read-check.ps1 -StsDir "$STS_DIR"
          else
            echo "RNG_STREAMS_READ_CHECK=not_run (game jars unavailable in CI; ran locally, see STATUS.md)"
          fi

      - name: 校验游戏 ID 提取工具可编译
        run: |
          mkdir -p build/inspect
          javac -encoding UTF-8 -d build/inspect tools/inspect/ExtractMonsterFacts.java

  mod-build:
    name: 完整 Mod 构建（需要仓库提供 libs/ 下的游戏依赖；否则本步会明确报告"未执行"）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      # 注意：这一步不能用 continue-on-error 掩盖结果。要么真的编译通过，
      # 要么在 summary 里明确写"未执行"，避免把"跳过的构建"当成"完整的绿色通过"。
      - name: 编译完整 Mod（有依赖就真编译，没有就明确标记未执行）
        run: |
          if [ -d libs ] && ls libs/*.jar >/dev/null 2>&1; then
            mkdir -p build/classes
            javac -encoding UTF-8 -cp "libs/*" -d build/classes $(find src/main/java -name '*.java')
            echo "完整 Mod 编译通过。" >> "$GITHUB_STEP_SUMMARY"
            echo "FULL_MOD_BUILD=passed" >> "$GITHUB_ENV"
          else
            echo "FULL_MOD_BUILD=not_run" >> "$GITHUB_ENV"
            {
              echo "### 完整 Mod 构建：未执行"
              echo ""
              echo "仓库没有提供游戏依赖 jar（desktop-1.0.jar / ModTheSpire.jar / BaseMod.jar 有版权，不入库）。"
              echo "因此本次绿色只代表**离线模拟层自检通过**，不代表完整 Mod 能从这份提交构建。"
              echo "完整构建请在装有游戏的机器上运行：\`powershell -File tools/build/build-release.ps1\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "未提供游戏依赖：完整 Mod 编译未执行（详见本次运行的 Summary）。"
          fi

      - name: 汇总本次实际覆盖范围
        run: |
          echo "离线模拟层自检：已执行并通过"
          echo "完整 Mod 构建：$FULL_MOD_BUILD"
